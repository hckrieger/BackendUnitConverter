<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Page</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Page content goes here -->
    <h1>Backend Unit Converter</h1>

    <button class="startForm" id="quickCalc">Quick Calculation</button> 
    <button class="startForm" id="addJob">Add Job</button>

    <br><br>
    <div id="formSection">
        <form id="addJobForm">
            <label for="job-number">Job Number:</label>
            <input type="number" id="job-number" name="job-number" />

            <label for="customer">Customer</label>
            <input type="number" id="customer" name="customer" />
            <br>
            <button id="jobSubmit" type="button" style="margin-top: 5px;">Submit</button>
        </form>
        <form id="calcForm">
            <label for="dispatch-number">Id:</label>
            <input type="number" id="dispatchNumber" value="6"/>
            <label>Stack Category:</label>
            <input type="radio" id="downstack" name="stackCategory" value="Downstack">
            <label style="display: inline; margin: 0;" for="downstack">Downstack:</label>
            <input type="radio" id="carton pack" name="stackCategory" value="Carton Pack" checked>
            <label style="display: inline; margin: 0;" for="carton pack" id="carton-pack-label">Carton Pack:</label>


            <label for="total-qty">Total Qty:</label>
            <input type="number" id="total" value="23456">

            <label for="units-per-lift">Books per Lift:</label>
            <input type="number" id="books" value="66"/>

            <label for="lifts-per-layer">Lifts per Layer</label>
            <input type="number" id="lifts" value="16"/>

            <label for="layers-per-skid">Layers per Skid</label>
            <input type="number" id="layers" value="4"/>
            <br>
            <button id="calcSubmit" type="button" style="margin-top: 5px;">Submit</button>
        </form>

    </div>
    <div id="jobsDisplay">
        <h2>Jobs</h2>
        <div id="specificJobs">
            <script>
                
            </script>
        </div>
    </div>
    <div id="calcOutput" style="margin-top: 10px;">
        <table>
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Quick Info</th>
                    <th>Lift Qty</th>
                    <th>Lifts in Layer</th>
                    <th>Layer Qty</th>
                    <th>Full Layers</th>
                    <th>Full Skid Qty</th>
                    <th>Partial Skid Qty</th>
                </tr>
            </thead>
            <tbody id="jobTableBody">
                <tr>
                    <td class="id">6</td>
                    <td class="quick-info">
                        <span class="full-skid-qty-quick"></span>
                        <span class="partial-skid-full-layers"></span>
                        <span class="partial-skid-units-in-leftover-lifts"></span>
                        <span class="partial-skid-units-in-leftover-books"></span>
                    </td>
                    <td class="lift-qty"></td>
                    <td class="lifts-in-layer"></td>
                    <td class="layer-qty"></td>
                    <td class="full-layers"></td>
                    <td class="full-skid-qty"></td>
                    <td class="partial-skid-qty"></td>
                </tr>
            </tbody>
        </table>
    </div>



    <script src="script.js"></script>
</body>
</html>
